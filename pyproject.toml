[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosalquant"
version = "0.1.0"
description = "Event-driven quantitative trading research framework"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "requests",
    "yfinance",
    "PyYAML",
    "dotenv",
    "pyarrow",
    "fastparquet"
]

[project.optional-dependencies]
plotting = ["matplotlib", "plotly"]
ui = ["customtkinter"]

[tool.setuptools.packages.find]
where = ["src"]
