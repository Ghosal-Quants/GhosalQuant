name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Installed, not editable, so the tests run against what a wheel would ship.
      - run: python -m pip install . pytest
      - run: python -m pytest tests --ignore=tests/legacy -q
